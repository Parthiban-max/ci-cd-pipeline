name: Continuous Integration (CI) Pipeline

# Trigger the CI workflow on pushes to main/develop and on all Pull Request events
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - master
      - develop

# Principle of least privilege: read-only access to repository contents
permissions:
  contents: read

# Concurrency group cancels previous in-flight runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Code & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Checkout the repository code
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js with caching
      - name: 2. Set Up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install clean dependencies via package-lock.json
      - name: 3. Install Dependencies (npm ci)
        run: npm ci

      # Step 4: Run ESLint for code quality and standard compliance
      - name: 4. Execute Code Linting (ESLint)
        run: npm run lint

      # Step 5: Execute Vitest automated unit tests
      - name: 5. Execute Automated Unit Tests (Vitest)
        run: npm test

      # Step 6: Scan dependencies for security vulnerabilities
      - name: 6. Security Vulnerability Scan (npm audit)
        run: npm audit --audit-level=high

      # Step 7: Validate production build & TypeScript compilation
      - name: 7. Execute Production Build (Vite + TypeScript)
        run: npm run build
